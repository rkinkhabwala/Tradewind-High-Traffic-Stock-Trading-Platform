server:
  port: ${PORTFOLIO_SERVICE_PORT:8085}

spring:
  application:
    name: portfolio-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${POSTGRES_USER:tradewind}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${PORTFOLIO_DB_POOL_SIZE:20}
      connection-timeout: 3000
      data-source-properties:
        options: "-c statement_timeout=5000"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Never silently truncate money: {"amountCents": 1.5} is a 400, not 1 cent.
      accept-float-as-int: false

tradewind:
  clock:
    mode: ${MARKET_CLOCK_MODE:FAST}
    speed: ${MARKET_CLOCK_SPEED:1}
    sim-start: ${MARKET_CLOCK_SIM_START:2026-01-05T09:29:00-05:00}
    real-epoch: ${MARKET_CLOCK_REAL_EPOCH:}
  snapshots:
    # How often to check whether a new 5-simulated-minute snapshot bucket has started.
    check-interval: ${SNAPSHOT_CHECK_INTERVAL:2s}
  portfolio:
    consumer-group: ${PORTFOLIO_CONSUMER_GROUP:portfolio-service}
  outbox:
    poll-interval: 50ms
    batch-size: 500
  ledger:
    # Optimistic-lock conflicts on balances are retried this many times before answering 503.
    max-attempts: ${LEDGER_MAX_ATTEMPTS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
