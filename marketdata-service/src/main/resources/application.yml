server:
  port: ${MARKETDATA_SERVICE_PORT:8082}

spring:
  application:
    name: marketdata-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MARKETDATA_DB_URL:jdbc:postgresql://localhost:5432/marketdata}
    username: ${POSTGRES_USER:tradewind}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${MARKETDATA_DB_POOL_SIZE:10}
      connection-timeout: 3000
      data-source-properties:
        options: "-c statement_timeout=5000"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000
  mvc:
    problemdetails:
      enabled: true

tradewind:
  clock:
    # FAST: simulated time = sim-start + (now - anchor) x speed, anchor shared via Redis. WALL: real time.
    mode: ${MARKET_CLOCK_MODE:FAST}
    speed: ${MARKET_CLOCK_SPEED:1}
    sim-start: ${MARKET_CLOCK_SIM_START:2026-01-05T09:29:00-05:00}
    # Optional fixed anchor (ISO-8601). Empty = first service to start sets it in Redis.
    real-epoch: ${MARKET_CLOCK_REAL_EPOCH:}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    # Per-symbol tick rate is spread over [min, max] ticks per second (~2,500/s for 500 symbols by default).
    tick-rate-min: ${SIMULATOR_TICK_RATE_MIN:1}
    tick-rate-max: ${SIMULATOR_TICK_RATE_MAX:10}
    # Meme-stock mode: one symbol ticks 100x/s with boosted volatility. Empty = off.
    hot-symbol: ${SIMULATOR_HOT_SYMBOL:}
    hot-tick-rate: ${SIMULATOR_HOT_TICK_RATE:100}
    hot-volatility-multiplier: ${SIMULATOR_HOT_VOLATILITY_MULTIPLIER:5}
    seed: ${SIMULATOR_SEED:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
