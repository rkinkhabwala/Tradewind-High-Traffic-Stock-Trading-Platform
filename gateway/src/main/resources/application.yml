server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # Route order matters: the rate-limited POST /api/orders route must precede the general orders route.
          routes:
            - id: auth
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: account
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/account/**,/api/watchlists/**
            - id: marketdata
              uri: ${MARKETDATA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/quotes/**,/api/symbols/**,/api/search/**
            - id: orders-place
              uri: lb://order-service
              predicates:
                - Path=/api/orders
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    # Per-user token bucket in Redis (spec 6.3: 10 orders/sec, burst 20). Keyed by JWT subject.
                    redis-rate-limiter.replenishRate: ${ORDER_RATE_LIMIT_PER_SECOND:10}
                    redis-rate-limiter.burstCapacity: ${ORDER_RATE_LIMIT_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: portfolio
              uri: ${PORTFOLIO_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/portfolio/**,/api/activity/**
            # WebSocket upgrade; authenticated by WsTicketFilter (one-time ticket from POST /api/ws/ticket).
            # Round-robin over the healthy stream-service instances (gateway.discovery.ServiceInstances).
            - id: stream
              uri: lb://stream-service
              predicates:
                - Path=/ws

    loadbalancer:
      # ServiceInstances already refreshes every 2s; a cached list would hide removed instances for 35s.
      cache:
        enabled: false

tradewind:
  # Scaled services the gateway balances itself (lb://...): Docker's DNS resolves each name to every container.
  discovery:
    refresh-interval: ${DISCOVERY_INTERVAL:2s}
    health-timeout: 1s
    services:
      stream-service:
        host: ${STREAM_SERVICE_HOST:localhost}
        port: ${STREAM_SERVICE_PORT:8086}
      order-service:
        host: ${ORDER_SERVICE_HOST:localhost}
        port: ${ORDER_SERVICE_PORT:8083}
  ws:
    ticket-ttl: ${WS_TICKET_TTL:30s}
  jwt:
    issuer: ${JWT_ISSUER:tradewind-account}
    jwk-set-uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json

management:
  metrics:
    # Every series carries the service name; histograms let Prometheus/Grafana compute percentiles.
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
        spring.cloud.gateway.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        spring.cloud.gateway.requests: 10s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
