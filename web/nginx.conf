# Serves the built app and proxies the API and WebSocket to the gateway, so the browser sees one origin
# (no CORS; the SameSite=Strict refresh cookie on /api/auth just works).

# Access log without query strings: /ws?ticket=... must never be logged.
log_format tradewind '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status '
                     '$body_bytes_sent $request_time "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3001;
    server_name _;
    access_log /var/log/nginx/access.log tradewind;
    root /usr/share/nginx/html;

    # Re-resolve the gateway (Docker DNS) so a restarted gateway with a new IP is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        # The app pings every 15s; this only bounds a connection that went completely silent.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        # nginx error messages include the request line (and so the ticket); keep only critical ones here.
        error_log /dev/stderr crit;
    }

    # Content-hashed bundles never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes all serve the app shell, which must not be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
