gatling {
  charting {
    indicators {
      # Percentiles shown in the report (spec 8 is stated in p99).
      percentile1 = 50
      percentile2 = 95
      percentile3 = 99
      percentile4 = 99.9
    }
  }
  http {
    # The gateway gives up after 5 s; waiting longer only piles up client connections under overload.
    requestTimeout = 10000
  }
}
