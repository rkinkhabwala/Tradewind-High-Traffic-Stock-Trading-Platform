global:
  scrape_interval: 5s

scrape_configs:
  - job_name: tradewind-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - account-service:8081
          - marketdata-service:8082
          - order-service:8083
          - execution-service:8084
          - portfolio-service:8085
