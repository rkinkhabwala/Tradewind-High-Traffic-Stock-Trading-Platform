global:
  scrape_interval: 5s

scrape_configs:
  - job_name: tradewind-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - account-service:8081
          - marketdata-service:8082
          - execution-service:8084
          - portfolio-service:8085

  # Scaled services (docker compose --scale): one target per container, found through Docker's DNS.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [order-service]
        type: A
        port: 8083
        refresh_interval: 10s

  - job_name: stream-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [stream-service]
        type: A
        port: 8086
        refresh_interval: 10s

  # Consumer-group lag per group/topic/partition (spec Phase 3 dashboards).
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
