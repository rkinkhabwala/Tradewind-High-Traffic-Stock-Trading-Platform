global:
  scrape_interval: 5s

scrape_configs:
  - job_name: tradewind-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - account-service:8081
          - marketdata-service:8082
          - order-service:8083
          - execution-service:8084
          - portfolio-service:8085

  # One target per stream-service instance (docker compose --scale), found through Docker's DNS.
  - job_name: stream-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [stream-service]
        type: A
        port: 8086
        refresh_interval: 10s
