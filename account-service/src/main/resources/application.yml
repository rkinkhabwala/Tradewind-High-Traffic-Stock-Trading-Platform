server:
  port: ${ACCOUNT_SERVICE_PORT:8081}

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/account}
    username: ${POSTGRES_USER:tradewind}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${ACCOUNT_DB_POOL_SIZE:10}
      connection-timeout: 3000
      data-source-properties:
        # Every query is bounded; a stuck statement fails instead of pinning a connection.
        options: "-c statement_timeout=5000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Never silently truncate money: {"amountCents": 1.5} is a 400, not 1 cent.
      accept-float-as-int: false

tradewind:
  jwt:
    issuer: ${JWT_ISSUER:tradewind-account}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    # PKCS#8 PEM RSA private key. Empty = generate an ephemeral key at startup (local dev only).
    private-key: ${JWT_PRIVATE_KEY:}
  auth:
    # Refresh-token cookie Secure flag; browsers accept Secure cookies on http://localhost.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  funding:
    portfolio-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8085}
    connect-timeout: 1s
    read-timeout: 3s
    max-amount-cents: ${FUNDING_MAX_AMOUNT_CENTS:100000000}
  seed:
    # Phase 1 seed: demo1@tradewind.test and demo2@tradewind.test with $100,000 each (docker-compose turns it on).
    demo-users: ${SEED_DEMO_USERS:false}
    demo-password: ${DEMO_USER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
