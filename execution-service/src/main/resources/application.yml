server:
  port: ${EXECUTION_SERVICE_PORT:8084}

spring:
  application:
    name: execution-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${EXECUTION_DB_URL:jdbc:postgresql://localhost:5432/execution}
    username: ${POSTGRES_USER:tradewind}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${EXECUTION_DB_POOL_SIZE:10}
      connection-timeout: 3000
      data-source-properties:
        options: "-c statement_timeout=5000"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

tradewind:
  clock:
    mode: ${MARKET_CLOCK_MODE:FAST}
    speed: ${MARKET_CLOCK_SPEED:1}
    sim-start: ${MARKET_CLOCK_SIM_START:2026-01-05T09:29:00-05:00}
    real-epoch: ${MARKET_CLOCK_REAL_EPOCH:}
  execution:
    consumer-group: ${EXECUTION_CONSUMER_GROUP:execution-service}
  outbox:
    poll-interval: 50ms
    batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
