name: tradewind

# Image tags are pinned and were verified with `docker pull` before being written here (spec section 10).
# Copy .env.example to .env before `docker compose up --build`. The Java services are built from ./Dockerfile.

# Shared by every Java service: infrastructure addresses (container network), the shared market clock,
# JSON (ECS) logs, a memory limit the JVM sizes its heap from, and a health check on /actuator/health.
x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 448m

x-java-env: &java-env
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  ACCOUNT_SERVICE_URL: http://account-service:8081
  MARKETDATA_SERVICE_URL: http://marketdata-service:8082
  ORDER_SERVICE_URL: http://order-service:8083
  PORTFOLIO_SERVICE_URL: http://portfolio-service:8085
  MARKET_CLOCK_MODE: ${MARKET_CLOCK_MODE:-FAST}
  MARKET_CLOCK_SPEED: ${MARKET_CLOCK_SPEED:-1}
  MARKET_CLOCK_SIM_START: ${MARKET_CLOCK_SIM_START:-2026-01-05T09:29:00-05:00}
  MARKET_CLOCK_REAL_EPOCH: ${MARKET_CLOCK_REAL_EPOCH:-}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768m

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the owning services with spec partition counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4.11
    # Redis holds only caches (quotes, rate limits, idempotency fast path); Postgres is the source of truth.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      # Use the bundled plugins; no network downloads at startup.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384m

  account-service:
    <<: *java-service
    build:
      context: .
      target: account-service
    image: tradewind/account-service:0.1.0
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8081}:8081"
    environment:
      <<: *java-env
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      SEED_DEMO_USERS: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  portfolio-service:
    <<: *java-service
    build:
      context: .
      target: portfolio-service
    image: tradewind/portfolio-service:0.1.0
    ports:
      - "${PORTFOLIO_SERVICE_PORT:-8085}:8085"
    environment:
      <<: *java-env
      PORTFOLIO_DB_URL: jdbc:postgresql://postgres:5432/portfolio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  marketdata-service:
    <<: *java-service
    build:
      context: .
      target: marketdata-service
    image: tradewind/marketdata-service:0.1.0
    ports:
      - "${MARKETDATA_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *java-env
      MARKETDATA_DB_URL: jdbc:postgresql://postgres:5432/marketdata
      SIMULATOR_HOT_SYMBOL: ${SIMULATOR_HOT_SYMBOL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  order-service:
    <<: *java-service
    build:
      context: .
      target: order-service
    image: tradewind/order-service:0.1.0
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *java-env
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orders
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  execution-service:
    <<: *java-service
    build:
      context: .
      target: execution-service
    image: tradewind/execution-service:0.1.0
    ports:
      - "${EXECUTION_SERVICE_PORT:-8084}:8084"
    environment:
      <<: *java-env
      EXECUTION_DB_URL: jdbc:postgresql://postgres:5432/execution
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  # Not published on the host: clients reach it only through the gateway's /ws route (ticket auth).
  # Scale with `docker compose up -d --scale stream-service=3`; the gateway finds every instance through Docker's
  # DNS, health-checks them every 2s and spreads new connections round-robin.
  stream-service:
    <<: *java-service
    build:
      context: .
      target: stream-service
    image: tradewind/stream-service:0.1.0
    environment:
      <<: *java-env
      STREAM_CONFLATION_INTERVAL: ${STREAM_CONFLATION_INTERVAL:-250ms}
      STREAM_MAX_SUBSCRIPTIONS: ${STREAM_MAX_SUBSCRIPTIONS:-100}
      STREAM_SLOW_CLIENT_TIMEOUT: ${STREAM_SLOW_CLIENT_TIMEOUT:-10s}
      STREAM_HEARTBEAT_INTERVAL: ${STREAM_HEARTBEAT_INTERVAL:-15s}
      STREAM_IDLE_TIMEOUT: ${STREAM_IDLE_TIMEOUT:-45s}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  gateway:
    <<: *java-service
    build:
      context: .
      target: gateway
    image: tradewind/gateway:0.1.0
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *java-env
      ORDER_RATE_LIMIT_PER_SECOND: ${ORDER_RATE_LIMIT_PER_SECOND:-10}
      ORDER_RATE_LIMIT_BURST: ${ORDER_RATE_LIMIT_BURST:-20}
      STREAM_SERVICE_HOST: stream-service
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      account-service:
        condition: service_healthy

  # The web app (nginx) on :3001: serves the React build and proxies /api and /ws to the gateway (one origin).
  web:
    build:
      context: ./web
    image: tradewind/web:0.1.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres-data:
  kafka-data:
